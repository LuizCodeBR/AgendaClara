services:
  - type: web
    name: agenda-clara-luizcodebr
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/public/config
    autoDeployTrigger: 'off'
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: demo
      - key: SERVER_ADDRESS
        value: 0.0.0.0
      - key: COOKIE_SECURE
        value: 'true'
      - key: APP_PUBLIC_DEMO
        value: 'true'
      - key: SERVER_FORWARD_HEADERS_STRATEGY
        value: framework
      - key: JAVA_TOOL_OPTIONS
        value: '-Xms64m -Xmx224m -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=48m -Xss512k'
      - key: SERVER_TOMCAT_THREADS_MAX
        value: '30'
      - key: SOURCE_URL
        value: https://github.com/LuizCodeBR/AgendaClara
# Demonstração sem banco persistente. Não provisiona planos pagos.
# H2 é reinicializado quando o armazenamento efêmero é descartado pela hospedagem.
