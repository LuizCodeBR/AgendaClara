services:
  - type: web
    name: agenda-clara-luizcodebr
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/public/config
    autoDeployTrigger: 'off'
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      - key: APP_DEMO_ENABLED
        value: 'true'
      - key: STORAGE_MODE
        value: persistent
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: MAIL_ENCRYPTION_KEY
        sync: false
      - key: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
        value: '5'
      - key: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
        value: '0'
      - key: SERVER_ADDRESS
        value: 0.0.0.0
      - key: COOKIE_SECURE
        value: 'true'
      - key: MAIL_MODE
        value: demo
      - key: APP_BASE_URL
        value: https://agenda-clara-luizcodebr.onrender.com
      - key: APP_PUBLIC_DEMO
        value: 'true'
      - key: SERVER_FORWARD_HEADERS_STRATEGY
        value: framework
      - key: JAVA_TOOL_OPTIONS
        value: '-Xms64m -Xmx224m -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=48m -Xss512k'
      - key: SERVER_TOMCAT_THREADS_MAX
        value: '30'
      - key: SOURCE_URL
        value: https://github.com/LuizCodeBR/AgendaClara
      - key: DEMO_DOWNLOAD_URL
        value: https://github.com/LuizCodeBR/AgendaClara/releases/download/v0.10.0/AgendaClara-0.10.0-demo.zip
# Banco externo Neon Free, criado separadamente; não provisiona recursos pagos.
# Forneça as credenciais JDBC/TLS e a chave estável como entradas privadas.
# Consulte docs/PERSISTENCIA-GRATUITA.md antes de implantar outra instalação.
