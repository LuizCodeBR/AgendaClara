spring:
  jackson:
    deserialization:
      accept-float-as-int: false
  application:
    name: agenda-clara
  profiles:
    default: demo
  datasource:
    hikari:
      maximum-pool-size: 10
      transaction-isolation: TRANSACTION_READ_COMMITTED
  flyway:
    locations: classpath:db/migration
server:
  tomcat:
    max-http-form-post-size: 16KB
    max-swallow-size: 16KB
    connection-timeout: 20s
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
app:
  storage:
    mode: ${STORAGE_MODE:local}
  mail:
    encryption-key: ${MAIL_ENCRYPTION_KEY:}
    key-file: ${MAIL_KEY_FILE:${AGENDA_DATA_DIR:./data}/mail-outbox.key}
    worker-enabled: ${MAIL_WORKER_ENABLED:true}
    mode: ${MAIL_MODE:disabled}
    base-url: ${APP_BASE_URL:}
    from: ${MAIL_FROM:}
    resend-key: ${RESEND_API_KEY:}
  registration:
    enabled: ${REGISTRATION_ENABLED:true}
  protection:
    access-per-minute: ${ACCESS_REQUESTS_PER_MINUTE:20}
    registration-per-minute: ${REGISTRATION_REQUESTS_PER_MINUTE:5}
    api-per-minute: ${API_REQUESTS_PER_MINUTE:1200}
    login-per-minute: ${LOGIN_REQUESTS_PER_MINUTE:120}
    account-per-minute: ${ACCOUNT_REQUESTS_PER_MINUTE:20}
    booking-per-minute: ${BOOKING_REQUESTS_PER_MINUTE:60}
    write-per-minute: ${WRITE_REQUESTS_PER_MINUTE:120}
  demo:
    enabled: ${APP_DEMO_ENABLED:false}
    public: ${APP_PUBLIC_DEMO:false}
  distribution:
    source-url: ${SOURCE_URL:}
    download-url: ${DEMO_DOWNLOAD_URL:}
  booking:
    horizon-days: 60
logging:
  level:
    org.springframework.security: WARN
