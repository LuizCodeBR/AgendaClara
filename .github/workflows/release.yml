name: Publicar downloads
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Compilar o mesmo aplicativo da entrega local
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..
          chmod +x mvnw
          mkdir -p .cache/tmp
          ./mvnw -B -ntp -DskipTests package
      - name: Verificar o JAR antes de distribuir
        run: |
          export AGENDA_DATA_DIR="$GITHUB_WORKSPACE/.cache/release-data"
          java -jar target/agenda-clara-0.1.0.jar --spring.profiles.active=demo > .cache/release-server.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/api/public/config > /dev/null; then break; fi
            sleep 1
          done
          node scripts/smoke.mjs http://127.0.0.1:8080
      - name: Montar os pacotes portáteis
        run: |
          mkdir -p .cache/release/AgendaClara-demo
          cp target/agenda-clara-0.1.0.jar .cache/release/AgendaClara-demo/
          cp scripts/distribution/iniciar-demo.cmd scripts/distribution/iniciar-demo.sh scripts/distribution/LEIA-ME.md .cache/release/AgendaClara-demo/
          (cd .cache/release && zip -r AgendaClara-0.1.0-demo.zip AgendaClara-demo)
          git archive --format=zip --prefix=AgendaClara/ -o .cache/release/AgendaClara-0.1.0-fonte.zip HEAD
          (cd .cache/release && sha256sum AgendaClara-0.1.0-demo.zip AgendaClara-0.1.0-fonte.zip > SHA256SUMS.txt)
      - name: Publicar os downloads da demonstração
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Agenda Clara 0.1.0 — web, mobile e local" \
            --notes-file docs/RELEASE-0.1.0.md \
            --prerelease \
            .cache/release/AgendaClara-0.1.0-demo.zip \
            .cache/release/AgendaClara-0.1.0-fonte.zip \
            .cache/release/SHA256SUMS.txt
