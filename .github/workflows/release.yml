name: Publicar downloads
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Identificar a versão da entrega
        run: echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Compilar o mesmo aplicativo da entrega local
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..
          chmod +x mvnw
          mkdir -p .cache/tmp
          ./mvnw -B -ntp -DskipTests package
      - name: Verificar o JAR antes de distribuir
        run: |
          export REGISTRATION_REQUESTS_PER_MINUTE=10
          export AGENDA_DATA_DIR="$GITHUB_WORKSPACE/.cache/release-data"
          java -jar target/agenda-clara-${RELEASE_VERSION}.jar --spring.profiles.active=demo > .cache/release-server.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/api/public/config > /dev/null; then break; fi
            sleep 1
          done
          node scripts/smoke.mjs http://127.0.0.1:8080
          node scripts/date-hours-smoke.mjs http://127.0.0.1:8080
          node scripts/registration-smoke.mjs http://127.0.0.1:8080
          node scripts/account-access-smoke.mjs http://127.0.0.1:8080
          node scripts/mail-queue-smoke.mjs http://127.0.0.1:8080
          node scripts/storage-smoke.mjs before http://127.0.0.1:8080 .cache/release-storage-fixture.json
          kill "$APP_PID"
          wait "$APP_PID" || true
          export AGENDA_BACKUP_PASSWORD='senha ficticia exclusiva dos testes de backup'
          set +e
          bash operacao.sh --operations=backup --data-dir=.cache/release-data --work-dir=.cache/release-operations
          OPERATIONS_STATUS=$?
          set -e
          test "$OPERATIONS_STATUS" -eq 2
          node scripts/operations-smoke.mjs .cache/release-operations
          BACKUP_PATH=".cache/release-operations/backups/$(node -p "JSON.parse(require('fs').readFileSync('.cache/release-operations/latest.json','utf8')).backup.lastVerified.filename")"
          java -Xmx512m -Djava.io.tmpdir=.cache/tmp -jar target/agenda-clara-${RELEASE_VERSION}.jar --backup=restore --input="$BACKUP_PATH" --target-dir=.cache/release-restored
          export AGENDA_DATA_DIR="$GITHUB_WORKSPACE/.cache/release-restored"
          java -jar target/agenda-clara-${RELEASE_VERSION}.jar --spring.profiles.active=demo > .cache/release-restored-server.log 2>&1 &
          APP_PID=$!
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/api/public/config > /dev/null; then break; fi
            sleep 1
          done
          node scripts/storage-smoke.mjs after http://127.0.0.1:8080 .cache/release-storage-fixture.json
      - name: Montar os pacotes portáteis
        run: |
          mkdir -p .cache/release/AgendaClara-demo
          cp target/agenda-clara-${RELEASE_VERSION}.jar .cache/release/AgendaClara-demo/agenda-clara.jar
          cp scripts/distribution/iniciar-demo.cmd scripts/distribution/iniciar-demo.sh scripts/distribution/backup.cmd scripts/distribution/backup.sh scripts/distribution/operacao.cmd scripts/distribution/operacao.sh scripts/distribution/LEIA-ME.md .cache/release/AgendaClara-demo/
          (cd .cache/release && zip -r AgendaClara-${RELEASE_VERSION}-demo.zip AgendaClara-demo)
          git archive --format=zip --prefix=AgendaClara/ -o .cache/release/AgendaClara-${RELEASE_VERSION}-fonte.zip HEAD
          (cd .cache/release && sha256sum AgendaClara-${RELEASE_VERSION}-demo.zip AgendaClara-${RELEASE_VERSION}-fonte.zip > SHA256SUMS.txt)
      - name: Publicar os downloads da demonstração
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Agenda Clara ${RELEASE_VERSION} — web, mobile e local" \
            --notes-file docs/RELEASE-${RELEASE_VERSION}.md \
            --prerelease \
            .cache/release/AgendaClara-${RELEASE_VERSION}-demo.zip \
            .cache/release/AgendaClara-${RELEASE_VERSION}-fonte.zip \
            .cache/release/SHA256SUMS.txt
