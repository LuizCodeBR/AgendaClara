name: Verificações
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agenda-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    name: API · Java ${{ matrix.java }} · ${{ matrix.database }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '26']
        database: [h2, postgres]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: agenda_test
          POSTGRES_USER: agenda
          POSTGRES_PASSWORD: test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U agenda -d agenda_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Testes de regras, segurança e concorrência
        env:
          AGENDA_PG_CONTAINER: ${{ matrix.database == 'postgres' && job.services.postgres.id || '' }}
          TEST_DB_URL: ${{ matrix.database == 'postgres' && 'jdbc:postgresql://localhost:5432/agenda_test' || 'jdbc:h2:mem:agenda-tests;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000' }}
          TEST_DB_USER: ${{ matrix.database == 'postgres' && 'agenda' || 'sa' }}
          TEST_DB_PASSWORD: ${{ matrix.database == 'postgres' && 'test-only' || '' }}
        run: |
          chmod +x mvnw
          mkdir -p .cache/tmp
          ./mvnw -B -ntp verify
  browser:
    name: Interface e aplicativo · desktop e celular
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/browsers
      AGENDA_DATA_DIR: ./.cache/e2e-data
      REGISTRATION_REQUESTS_PER_MINUTE: 30
      ACCESS_REQUESTS_PER_MINUTE: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verificar e compilar a interface
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
          npx playwright install --with-deps chromium
      - name: Testar o pacote real no navegador
        run: |
          chmod +x mvnw
          mkdir -p .cache/tmp
          ./mvnw -B -ntp -DskipTests package
          java -jar target/agenda-clara-0.8.1.jar --spring.profiles.active=demo > .cache/e2e-server.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true; cat "$GITHUB_WORKSPACE/.cache/e2e-server.log"' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/api/public/config > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/api/public/config
          node scripts/smoke.mjs http://127.0.0.1:8080
          node scripts/date-hours-smoke.mjs http://127.0.0.1:8080
          node scripts/registration-smoke.mjs http://127.0.0.1:8080
          node scripts/account-access-smoke.mjs http://127.0.0.1:8080
          node scripts/mail-queue-smoke.mjs http://127.0.0.1:8080
          cd frontend
          npm run test:e2e
          cd ..
          node scripts/storage-smoke.mjs before http://127.0.0.1:8080 .cache/storage-fixture.json
          kill "$APP_PID"
          wait "$APP_PID" || true
          export AGENDA_BACKUP_PASSWORD='senha ficticia exclusiva dos testes de backup'
          set +e
          bash operacao.sh --operations=backup --data-dir=.cache/e2e-data --work-dir=.cache/browser-operations
          OPERATIONS_STATUS=$?
          set -e
          test "$OPERATIONS_STATUS" -eq 2
          node scripts/operations-smoke.mjs .cache/browser-operations
          BACKUP_PATH=".cache/browser-operations/backups/$(node -p "JSON.parse(require('fs').readFileSync('.cache/browser-operations/latest.json','utf8')).backup.lastVerified.filename")"
          java -Xmx512m -Djava.io.tmpdir=.cache/tmp -jar target/agenda-clara-0.8.1.jar --backup=verify --input="$BACKUP_PATH"
          java -Xmx512m -Djava.io.tmpdir=.cache/tmp -jar target/agenda-clara-0.8.1.jar --backup=restore --input="$BACKUP_PATH" --target-dir=.cache/e2e-restored
          export AGENDA_DATA_DIR="$GITHUB_WORKSPACE/.cache/e2e-restored"
          java -jar target/agenda-clara-0.8.1.jar --spring.profiles.active=demo > .cache/restored-server.log 2>&1 &
          APP_PID=$!
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/api/public/config > /dev/null; then break; fi
            sleep 1
          done
          node scripts/storage-smoke.mjs after http://127.0.0.1:8080 .cache/storage-fixture.json
  docker:
    name: Docker e PostgreSQL · demonstração
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Construir e verificar a aplicação completa
        run: |
          trap 'docker compose logs; docker compose down' EXIT
          docker compose up --build -d
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8080/api/public/config > /dev/null; then break; fi
            sleep 1
          done
          node scripts/smoke.mjs http://127.0.0.1:8080
          node scripts/date-hours-smoke.mjs http://127.0.0.1:8080
          node scripts/registration-smoke.mjs http://127.0.0.1:8080
          node scripts/account-access-smoke.mjs http://127.0.0.1:8080
          node scripts/mail-queue-smoke.mjs http://127.0.0.1:8080
      - name: Verificar persistência após recriar o contêiner
        run: |
          trap 'docker compose logs; docker compose down' EXIT
          docker compose up --force-recreate -d app
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/api/public/config > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/api/public/config